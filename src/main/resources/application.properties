# Database Configuration - Use environment variables for production
# Development defaults to localhost, production should use environment variables
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/xperience_db}
spring.datasource.username=${DATABASE_USERNAME:xperience_user}
spring.datasource.password=${DATABASE_PASSWORD:Islam1997@ali}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Performance optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# JWT Secret - Use environment variable for production
app.jwt-secret-base64=${JWT_SECRET_BASE64:FyK1Gp2vVkp+0cA08Ttbi6pCtvMb9BBkqS9+3i6CvP1dyhWm2Eeo8RStRjVTTa3lW+nI0Q9iOxXhvl7mXhind0902==}
app.jwt-alg=HS256
app.jwt-ttl-seconds=86400

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server Port - Use environment variable for production
server.port=${PORT:8080}

# Allowed Origins - Use environment variable for production
# For production, set: ALLOWED_ORIGINS=https://your-vercel-app.vercel.app,http://localhost:3000
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}
# Google OAuth Client ID - Use environment variable for production
app.google-client-id=${GOOGLE_CLIENT_ID:128297296458-8nj8i8ej0mcrq5drskb2iargscjl3s59.apps.googleusercontent.com}

logging.level.root=INFO
logging.level.org.springframework.security=INFO

